<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iris — Saints U14G Fall 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f8f7; --surface:#ffffff; --fg:#14201b; --muted:#5d6b64; --line:#dbe3df; --accent:#0f6b4f; --accent-fg:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --goal-bg:#ffe1d6; --goal-fg:#a82b00; --teach-bg:#fff0d0; --teach-fg:#7d4600; --chance-bg:#dcf4e1; --chance-fg:#17692f;
  --defend-bg:#e0ebff; --defend-fg:#1f4fb5; --calm-bg:#d6f2ef; --calm-fg:#0b6560; --takeon-bg:#eee2fb; --takeon-fg:#6a2fb0;
  --combine-bg:#fde3ec; --combine-fg:#a3224d;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1714; --surface:#16211d; --fg:#e6eee9; --muted:#9bada5; --line:#27362f; --accent:#4fd1a1; --accent-fg:#06231a;
  --goal-bg:#40190d; --goal-fg:#ff9a73; --teach-bg:#3a2c10; --teach-fg:#f5b04d; --chance-bg:#14301c; --chance-fg:#6fd48a;
  --defend-bg:#15264a; --defend-fg:#7fa8ff; --calm-bg:#0f302d; --calm-fg:#5fd3cb; --takeon-bg:#2a1b40; --takeon-fg:#c39bf5;
  --combine-bg:#40172a; --combine-fg:#f58bb0; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
.wrap{max-width:760px;margin:0 auto}
.eyebrow{font:600 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font:700 clamp(48px,12vw,84px)/.95 var(--display);margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:10px 0 0}
.sub b{color:var(--fg);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 8px}
.f{font:500 14px/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:999px;cursor:pointer}
.f small{opacity:.7;margin-left:5px}
.f:focus-visible,.watch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.f.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.f[data-t]{background:var(--tb);color:var(--tf);border-color:var(--tf)}
.f[data-t].on{background:var(--tf);color:var(--bg)}
.game{margin-top:28px}
.game h2{font:700 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.game h2 span{font:500 14px/1 var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
ul{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.note{min-width:0}
.txt{margin:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.clock{font:500 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;margin-right:2px}
.tag{font:600 12px/1 var(--body);padding:4px 8px;border-radius:999px;background:var(--tb);color:var(--tf);white-space:nowrap}
.watch{font:600 15px/1 var(--body);text-decoration:none;background:var(--accent);color:var(--accent-fg);padding:11px 16px;border-radius:8px;white-space:nowrap;display:inline-block}
.watch:hover{filter:brightness(1.08)}
.empty{color:var(--muted);padding:20px 0}
.t-goal{--tb:var(--goal-bg);--tf:var(--goal-fg)}.t-teach{--tb:var(--teach-bg);--tf:var(--teach-fg)}.t-chance{--tb:var(--chance-bg);--tf:var(--chance-fg)}
.t-defend{--tb:var(--defend-bg);--tf:var(--defend-fg)}.t-calm{--tb:var(--calm-bg);--tf:var(--calm-fg)}.t-takeon{--tb:var(--takeon-bg);--tf:var(--takeon-fg)}.t-combine{--tb:var(--combine-bg);--tf:var(--combine-fg)}
.foot{margin-top:40px;color:var(--muted);font-size:14px}
@media (max-width:460px){li{grid-template-columns:1fr}.watch{justify-self:start}}
@media (prefers-reduced-motion:no-preference){.f,.watch{transition:background .15s,filter .15s}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Saints U14 Girls · Fall 2026</p>
  <h1>Iris</h1>
  <p class="sub" id="sub"></p>
  <div class="filters" id="filters" role="group" aria-label="Filter clips by tag"></div>
  <div id="games"></div>
  <p class="foot">Each clip opens in Dropbox in a new tab. The note under each clip is Coach Ben's.</p>
</div>

<script>
const D={"tags": [["goal", "Goal scored"], ["teach", "Teach"], ["chance", "Goals & chances"], ["defend", "Defend"], ["calm", "Calm on ball"], ["takeon", "Take on"], ["combine", "Pass & combine"]], "games": [{"date": "2026-09-13", "opp": "Oregon Surf", "clips": [{"cid": "C_20", "t": "20:43-21:02", "label": "Iris goal kick through center, not to wings", "tags": ["chance"], "href": "2026-09-13_vs-oregon-surf/players/iris/01_C_20_iris-goal-kick-through-center-not-to-wings.mp4"}, {"cid": "C_23", "t": "22:44-23:08", "label": "Iris brilliant defensive cover, Lillian turnover, Iris forces out of bounds", "tags": ["defend", "takeon"], "href": "2026-09-13_vs-oregon-surf/players/iris/02_C_23_iris-brilliant-defensive-cover-lillian-turnover-iris-forces.mp4"}, {"cid": "C_28", "t": "28:47-29:07", "label": "Joelle drop pass to Morgan; simultaneously Iris releases Catherine to join attack", "tags": ["combine"], "href": "2026-09-13_vs-oregon-surf/players/iris/03_C_28_joelle-drop-pass-to-morgan-simultaneously-iris-releases-cath.mp4"}, {"cid": "C_31", "t": "32:02-32:22", "label": "Iris brilliant defense, drives player wide, steps back, leaves for backs", "tags": ["defend", "takeon"], "href": "2026-09-13_vs-oregon-surf/players/iris/04_C_31_iris-brilliant-defense-drives-player-wide-steps-back-leaves.mp4"}, {"cid": "C_37", "t": "46:47-47:07", "label": "Iris wins ball, doesn't look to join attack, plays to Lilly too early before covered", "tags": ["defend"], "href": "2026-09-13_vs-oregon-surf/players/iris/05_C_37_iris-wins-ball-doesn-t-look-to-join-attack-plays-to-lilly-to.mp4"}, {"cid": "C_40", "t": "52:06-52:26", "label": "Brilliant step up into attack to win the ball, plays forward", "tags": ["defend"], "href": "2026-09-13_vs-oregon-surf/players/iris/06_C_40_brilliant-step-up-into-attack-to-win-the-ball-plays-forward.mp4"}, {"cid": "C_52", "t": "75:12-75:32", "label": "Iris good drive forward to create an attacking chance", "tags": ["chance", "takeon"], "href": "2026-09-13_vs-oregon-sur areness-focus-top-player-upside.mp4"}, {"cid": "C_18", "t": "31:36", "label": "TEACH Good interception, drives forward; play through center softer", "tags": ["teach", "defend", "takeon"], "href": "2026-10-03_vs-pcu/players/iris/02_C_18_teach-good-interception-drives-forward-play-through-center-s.mp4"}, {"cid": "C_23", "t": "36:58", "label": "Great tackle", "tags": ["defend"], "href": "2026-10-03_vs-pcu/players/iris/03_C_23_great-tackle.mp4"}, {"cid": "C_25", "t": "37:34", "label": "Good double win", "tags": ["defend"], "href": "2026-10-03_vs-pcu/players/iris/04_C_25_good-double-win.mp4"}, {"cid": "C_27", "t": "38:00", "label": "Beautiful diamond Leire-Iris-Gia", "tags": ["combine"], "href": "2026-10-03_vs-pcu/players/iris/05_C_27_beautiful-diamond-leire-iris-gia.mp4"}, {"cid": "C_61", "t": "1:26:36", "label": "Wins it in midfield, explodes into attack", "tags": ["defend"], "href": "2026-10-03_vs-pcu/players/iris/06_C_61_wins-it-in-midfield-explodes-into-attack.mp4"}]}, {"date": "2026-10-04", "opp": "Fsc", "clips": [{"cid": "C_03", "t": "18:23", "label": "Nice through ball from Iris to Lainey", "tags": ["combine"], "href": "2026-10-04_vs-fsc/players/iris/01_C_03_nice-through-ball-from-iris-to-lainey.mp4"}]}, {"date": "2026-10-10", "opp": "Oregon Surf", "clips": [{"cid": "C_13", "t": "47:32", "label": "Beautiful defensive cover", "tags": ["defend"], "href": "2026-10-10_vs-oregon-surf/players/iris/01_C_13_beautiful-defensive-cover.mp4"}, {"cid": "C_17", "t": "50:26", "label": "Great recovery - misreads at first, shows athleticism to get back, puts her body into the player", "tags": ["defend"], "href": "2026-10-10_vs-oregon-surf/players/iris/02_C_17_great-recovery-misreads-at-first-shows-athleticism-to-get-ba.mp4"}, {"cid": "C_37", "t": "1:34:40", "label": "Great forward drive. TEACH Can she lay the ball off?", "tags": ["teach", "takeon"], "href": "2026-10-10_vs-oregon-surf/players/iris/03_C_37_great-forward-drive-teach-can-she-lay-the-ball-off.mp4"}, {"cid": "C_48", "t": "1:52:10", "label": "Good rotation from Joelle to Leire to Iris to get out of danger", "tags": [], "href": "2026-10-10_vs-oregon-surf/players/iris/04_C_48_good-rotation-from-joelle-to-leire-to-iris-to-get-out-of-dan.mp4"}]}, {"date": "2026-10-17", "opp": "Lincoln Fc", "clips": [{"cid": "C_13", "t": "9:53", "label": "TEACH: Iris needs to clear the ball wider", "tags": ["teach", "defend"], "href": "2026-10-17_vs-lincoln-fc/players/iris/01_C_13_teach-iris-needs-to-clear-the-ball-wider.mp4"}, {"cid": "C_15", "t": "11:34", "label": "Iris nice drive forward out of center back", "tags": ["takeon"], "href": "2026-10-17_vs-lincoln-fc/players/iris/02_C_15_iris-nice-drive-forward-out-of-center-back.mp4"}, {"cid": "C_19", "t": "19:19", "label": "TEACH: Iris starting position too wide, lets striker in; tighter to goal-side player. Recovers nicely to win ball", "tags": ["teach", "chance", "defend"], "href": "2026-10-17_vs-lincoln-fc/players/iris/03_C_19_teach-iris-starting-position-too-wide-lets-striker-in-tighte.mp4"}, {"cid": "C_23", "t": "22:00", "label": "Iris good communication to Riley to reset backline shape", "tags": [], "href": "2026-10-17_vs-lincoln-fc/players/iris/04_C_23_iris-good-communication-to-riley-to-reset-backline-shape.mp4"}, {"cid": "C_47", "t": "1:02:05", "label": "TEACH (conceded goal): Izzy cuts back inside near her box (keep driving wide to corner); plays to Iris centrally; Iris overreacts, clears short/central; 1:02:26 Iris stabs/pounces too early, should block - player gets past", "tags": ["teach", "chance", "defend"], "href": "2026-10-17_vs-lincoln-fc/players/iris/05_C_47_teach-conceded-goal-izzy-cuts-back-inside-near-her-box-keep.mp4"}, {"cid": "C_53", "t": "1:09:04", "label": "Iris excellent hard work", "tags": [], "href": "2026-10-17_vs-lincoln-fc/players/iris/06_C_53_iris-excellent-hard-work.mp4"}, {"cid": "C_55", "t": "1:12:10", "label": "Iris very strong center back play", "tags": ["defend"], "href": "2026-10-17_vs-lincoln-fc/players/iris/07_C_55_iris-very-strong-center-back-play.mp4"}, {"cid": "C_60", "t": "1:19:45", "label": "TEACH: Mo/Iris roll should go backward so Iris gains strength; rolled sideways, doesn't help Iris", "tags": ["teach", "defend"], "href": "2026-10-17_vs-lincoln-fc/players/iris/08_C_60_teach-mo-iris-roll-should-go-backward-so-iris-gains-strength.mp4"}]}]};
const BASE='https://www.dropbox.com/scl/fo/ihin7qn8o1oljnsx1b0q2/ACAj5muSS0h2_ZUz6kBUzIg?rlkey=dsakpc7ajzmrn2vyhlx0n93ub&st=96j8mdka&preview=';
const TN=Object.fromEntries(D.tags);
const order=["goal", "teach", "chance", "defend", "calm", "takeon", "combine"];
let sel=null;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(d){const [y,m,dd]=d.split('-').map(Number);const x=new Date(y,m-1,dd);return DOW[x.getDay()]+', '+MON[m-1]+' '+dd;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
const all=D.games.flatMap(g=>g.clips);
const goals=all.filter(c=>c.tags.includes('goal')).length;
document.getElementById('sub').innerHTML='<b>'+all.length+' clips</b> from '+D.games.length+' games'+(goals?', including '+goals+' goals':'');
function renderFilters(){
  const box=document.getElementById('filters');box.textContent='';
  const a=el('button','f'+(sel?'':' on'),'All');a.type='button';a.id='f-all';a.append(el('small',null,String(all.length)));
  a.onclick=()=>{sel=null;render();};box.append(a);
  order.filter(k=>TN[k]).forEach(k=>{
    const n=all.filter(c=>c.tags.includes(k)).length;if(!n)return;
    const b=el('button','f t-'+k+(sel===k?' on':''),TN[k]);b.type='button';b.dataset.t=k;b.id='f-'+k;
    b.append(el('small',null,String(n)));b.setAttribute('aria-pressed',sel===k);
    b.onclick=()=>{sel=sel===k?null:k;render();};box.append(b);
  });
}
function renderGames(){
  const root=document.getElementById('games');root.textContent='';
  let shown=0;
  D.games.forEach(g=>{
    const cl=g.clips.filter(c=>!sel||c.tags.includes(sel));if(!cl.length)return;shown+=cl.length;
    const sec=el('section','game');
    const h=el('h2',null,'vs '+g.opp);h.append(el('span',null,fmt(g.date)+' · '+cl.length+(cl.length===1?' clip':' clips')));
    sec.append(h);
    const ul=el('ul');
    cl.forEach(c=>{
      const li=el('li');const n=el('div','note');
      n.append(el('p','txt',c.label));
      const m=el('div','meta');
      if(c.t)m.append(el('span','clock','Game time '+c.t));
      order.filter(k=>c.tags.includes(k)).forEach(k=>m.append(el('span','tag t-'+k,TN[k])));
      n.append(m);
      const a=el('a','watch','Watch');a.href=BASE+encodeURIComponent(c.href)+'&dl=0';a.target='_blank';a.rel='noopener';
      a.setAttribute('aria-label','Watch clip: '+c.label);
      li.append(n,a);ul.append(li);
    });
    sec.append(ul);root.append(sec);
  });
  if(!shown)root.append(el('p','empty','No clips with this tag.'));
}
function render(){renderFilters();renderGames();}
render();
</script>
