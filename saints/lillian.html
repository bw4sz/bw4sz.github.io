<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lillian — Saints U14G Fall 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f8f7; --surface:#ffffff; --fg:#14201b; --muted:#5d6b64; --line:#dbe3df; --accent:#0f6b4f; --accent-fg:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --goal-bg:#ffe1d6; --goal-fg:#a82b00; --teach-bg:#fff0d0; --teach-fg:#7d4600; --chance-bg:#dcf4e1; --chance-fg:#17692f;
  --defend-bg:#e0ebff; --defend-fg:#1f4fb5; --calm-bg:#d6f2ef; --calm-fg:#0b6560; --takeon-bg:#eee2fb; --takeon-fg:#6a2fb0;
  --combine-bg:#fde3ec; --combine-fg:#a3224d;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1714; --surface:#16211d; --fg:#e6eee9; --muted:#9bada5; --line:#27362f; --accent:#4fd1a1; --accent-fg:#06231a;
  --goal-bg:#40190d; --goal-fg:#ff9a73; --teach-bg:#3a2c10; --teach-fg:#f5b04d; --chance-bg:#14301c; --chance-fg:#6fd48a;
  --defend-bg:#15264a; --defend-fg:#7fa8ff; --calm-bg:#0f302d; --calm-fg:#5fd3cb; --takeon-bg:#2a1b40; --takeon-fg:#c39bf5;
  --combine-bg:#40172a; --combine-fg:#f58bb0; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
.wrap{max-width:760px;margin:0 auto}
.eyebrow{font:600 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font:700 clamp(48px,12vw,84px)/.95 var(--display);margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:10px 0 0}
.sub b{color:var(--fg);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 8px}
.f{font:500 14px/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:999px;cursor:pointer}
.f small{opacity:.7;margin-left:5px}
.f:focus-visible,.watch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.f.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.f[data-t]{background:var(--tb);color:var(--tf);border-color:var(--tf)}
.f[data-t].on{background:var(--tf);color:var(--bg)}
.game{margin-top:28px}
.game h2{font:700 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.game h2 span{font:500 14px/1 var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
ul{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.note{min-width:0}
.txt{margin:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.clock{font:500 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;margin-right:2px}
.tag{font:600 12px/1 var(--body);padding:4px 8px;border-radius:999px;background:var(--tb);color:var(--tf);white-space:nowrap}
.watch{font:600 15px/1 var(--body);text-decoration:none;background:var(--accent);color:var(--accent-fg);padding:11px 16px;border-radius:8px;white-space:nowrap;display:inline-block}
.watch:hover{filter:brightness(1.08)}
.empty{color:var(--muted);padding:20px 0}
.t-goal{--tb:var(--goal-bg);--tf:var(--goal-fg)}.t-teach{--tb:var(--teach-bg);--tf:var(--teach-fg)}.t-chance{--tb:var(--chance-bg);--tf:var(--chance-fg)}
.t-defend{--tb:var(--defend-bg);--tf:var(--defend-fg)}.t-calm{--tb:var(--calm-bg);--tf:var(--calm-fg)}.t-takeon{--tb:var(--takeon-bg);--tf:var(--takeon-fg)}.t-combine{--tb:var(--combine-bg);--tf:var(--combine-fg)}
.foot{margin-top:40px;color:var(--muted);font-size:14px}
@media (max-width:460px){li{grid-template-columns:1fr}.watch{justify-self:start}}
@media (prefers-reduced-motion:no-preference){.f,.watch{transition:background .15s,filter .15s}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Saints U14 Girls · Fall 2026</p>
  <h1>Lillian</h1>
  <p class="sub" id="sub"></p>
  <div class="filters" id="filters" role="group" aria-label="Filter clips by tag"></div>
  <div id="games"></div>
  <p class="foot">Each clip opens in Dropbox in a new tab. The note under each clip is Coach Ben's.</p>
</div>

<script>
const D={"tags": [["goal", "Goal scored"], ["teach", "Teach"], ["chance", "Goals & chances"], ["defend", "Defend"], ["calm", "Calm on ball"], ["takeon", "Take on"], ["combine", "Pass & combine"]], "games": [{"date": "2026-09-13", "opp": "Oregon Surf", "clips": [{"cid": "C_23", "t": "22:44-23:08", "label": "Iris brilliant defensive cover, Lillian turnover, Iris forces out of bounds", "tags": ["defend", "takeon"], "href": "2026-09-13_vs-oregon-surf/players/lillian/01_C_23_iris-brilliant-defensive-cover-lillian-turnover-iris-forces.mp4"}, {"cid": "C_37", "t": "46:47-47:07", "label": "Iris wins ball, doesn't look to join attack, plays to Lilly too early before covered", "tags": ["defend"], "href": "2026-09-13_vs-oregon-surf/players/lillian/02_C_37_iris-wins-ball-doesn-t-look-to-join-attack-plays-to-lilly-to.mp4"}]}, {"date": "2026-09-19", "opp": "Columbia Premier", "clips": [{"cid": "C_19", "t": "13:35-13:55", "label": "Good tackle, physicality", "tags": ["defend"], "href": "2026-09-19_vs-columbia-premier/players/lillian/01_C_19_good-tackle-physicality.mp4"}, {"cid": "C_25", "t": "19:54-20:39", "label": "Lillian drives, times cut, drops to Leire, leads to Morgan ball in behind", "tags": ["takeon", "combine"], "href": "2026-09-19_vs-columbia-premier/players/lillian/02_C_25_lillian-drives-times-cut-drops-to-leire-leads-to-morgan-ball.mp4"}, {"cid": "C_30", "t": "23:20-23:40", "label": "Teaching: needed to get to ball and seal off defender, didn't", "tags": ["teach"], "href": "2026-09-19_vs-columbia-premier/players/lillian/03_C_30_teaching-needed-to-get-to-ball-and-seal-off-defender-didn-t.mp4"}, {"cid": "C_37", "t": "30:15-30:35", "label": "Teaching: needs to get in front of the defender again", "tags": ["teach"], "href": "2026-09-19_vs-columbia-premier/players/lillian/04_C_37_teaching-needs-to-get-in-front-of-the-defender-again.mp4"}, {"cid": "C_53", "t": "70:16-70:36", "label": "Good pressure", "tags": ["defend"], "href": "2026-09-19_vs-columbia-premier/players/lillian/05_C_53_good-pressure.mp4"}]}, {"date": "2026-09-26", "opp": "Lincoln Fc", "clips": [{"cid": "C_04", "t": "16:01", "label": "Good pass centrally from the wing", "tags": ["combine"], "href": "2026-09-26_vs-lincoln-fc/players/lillian/01_C_04_good-pass-centrally-from-the-wing.mp4"}, {"cid": "C_25", "t": "31:12", "label": "Good physicality, knocked down, gets back up", "tags": ["defend"], "href": "2026-09-26_vs-lincoln-fc/players/lillian/02_C_25_good-physicality-knocked-down-gets-back-up.mp4"}, {"cid": "C_27", "t": "32:01", "label": "Great tackle", "tags": ["defend"], "href": "2026-09-26_vs-lincoln-fc/players/lillian/03_C_27_great-tackle.mp4"}, {"cid": "C_33", "t": "39:49", "label": "Good defensive work", "tags": ["defend"], "href": "2026-09-26_vs-lincoln-fc/players/lillian/04_C_33_good-defensive-work.mp4"}, {"cid": "C_36", "t": "42:44", "label": "Good combination play", "tags": ["combine"], "href": "2026-09-26_vs-lincoln-fc/players/lillian/05_C_36_good-combination-play.mp4"}, {"cid": "C_40", "t": "43:50", "label": "Good ball in behind", "tags": ["combine"], "href": "2026-09-26_vs-lincoln-fc/players/lillian/06_C_40_good-ball-in-behind.mp4"}, {"cid": "C_41", "t": "44:07", "label": "Good ball into feet from Morgan; Lillian gets into a better winger position to combine", "tags": ["combine"], "href": "2026-09-26_vs-lincoln-fc/players/lillian/07_C_41_good-ball-into-feet-from-morgan-lillian-gets-into-a-better-w.mp4"}, {"cid": "C_53", "t": "61:45", "label": "TEACHING — poor decision, doesn't recover", "tags": ["teach", "defend"], "href": "2026-09-26_vs-lincoln-fc/players/lillian/08_C_53_teaching-poor-decision-doesn-t-recover.mp4"}]}, {"date": "2026-10-03", "opp": "Pcu", "clips": [{"cid": "C_21", "t": "35:15", "label": "PRIORITY Win ball, lay off - win then back pass to keep possession", "tags": ["defend", "combine"], "href": "2026-10-03_vs-pcu/players/lillian/01_C_21_priority-win-ball-lay-off-win-then-back-pass-to-keep-possess.mp4"}, {"cid": "C_35", "t": "48:43", "label": "Midfield: connecting play, winning passes, involved", "tags": ["combine"], "href": "2026-10-03_vs-pcu/players/lillian/02_C_35_midfield-connecting-play-winning-passes-involved.mp4"}, {"cid": "C_36", "t": "49:05", "label": "Lillian tackle win; Leire to Morgan; Morgan back to Lillian to Gia - calm diamond possession", "tags": ["defend", "calm", "combine"], "href": "2026-10-03_vs-pcu/players/lillian/03_C_36_lillian-tackle-win-leire-to-morgan-morgan-back-to-lillian-to.mp4"}, {"cid": "C_40", "t": "1:05:01", "label": "TEACH Lillian wins ball, plays into Gia - new diamond created", "tags": ["teach", "defend", "combine"], "href": "2026-10-03_vs-pcu/players/lillian/04_C_40_teach-lillian-wins-ball-plays-into-gia-new-diamond-created.mp4"}, {"cid": "C_46", "t": "1:09:06", "label": "Good win, plays ball into Lillian", "tags": ["defend", "combine"], "href": "2026-10-03_vs-pcu/players/lillian/05_C_46_good-win-plays-ball-into-lillian.mp4"}, {"cid": "C_47", "t": "1:10:22", "label": "Evie wins, into Lillian; Lillian reverses to Morgan to Mo", "tags": ["defend", "combine"], "href": "2026-10-03_vs-pcu/players/lillian/06_C_47_evie-wins-into-lillian-lillian-reverses-to-morgan-to-mo.mp4"}]}, {"date": "2026-10-17", "opp": "Lincoln Fc", "clips": [{"cid": "C_01", "t": "1:06", "label": "Lillian pass into Lainey, early shot away (Lainey's goal for the game)", "tags": ["goal", "chance", "combine"], "href": "2026-10-17_vs-lincoln-fc/players/lillian/01_C_01_lillian-pass-into-lainey-early-shot-away-lainey-s-goal-for-t.mp4"}, {"cid": "C_20", "t": "20:39", "label": "Lillian good win of a loose ball", "tags": ["defend"], "href": "2026-10-17_vs-lincoln-fc/players/lillian/02_C_20_lillian-good-win-of-a-loose-ball.mp4"}, {"cid": "C_36", "t": "47:25", "label": "Mo good forward dribbling", "tags": ["takeon"], "href": "2026-10-17_vs-lincoln-fc/players/lillian/03_C_36_mo-good-forward-dribbling.mp4"}, {"cid": "C_54", "t": "1:09:44", "label": "Ila great simple play; Lillian receives, lays off to Gia, forward run (1:09:58); Ila finds drop passes well (1:10:09)", "tags": ["calm", "combine"], "href": "2026-10-17_vs-lincoln-fc/players/lillian/04_C_54_ila-great-simple-play-lillian-receives-lays-off-to-gia-forwa.mp4"}, {"cid": "C_56", "t": "1:12:22", "label": "Lillian excellent winger play: wins ball, drives forward, puts foot on it, reverses back into center", "tags": ["defend", "takeon", "combine"], "href": "2026-10-17_vs-lincoln-fc/players/lillian/05_C_56_lillian-excellent-winger-play-wins-ball-drives-forward-puts.mp4"}, {"cid": "C_64", "t": "52:30", "label": "TEACH: Lillian too much pressure", "tags": ["teach", "defend"], "href": "2026-10-17_vs-lincoln-fc/players/lillian/03_C_64_teach-lillian-too-much-pressure.mp4"}]}, {"date": "2026-11-01", "opp": "Lcysa", "clips": [{"cid": "C_43", "t": "22:47", "label": "Good technique", "tags": [], "href": "2026-11-01_vs-lcysa/players/lillian/01_C_43_good-technique.mp4"}, {"cid": "C_51", "t": "34:25", "label": "Good quick throw-in", "tags": [], "href": "2026-11-01_vs-lcysa/players/lillian/02_C_51_good-quick-throw-in.mp4"}, {"cid": "C_54", "t": "49:57", "label": "Not enough patience under pressure; patience-pounce", "tags": ["defend", "calm"], "href": "2026-11-01_vs-lcysa/players/lillian/03_C_54_not-enough-patience-under-pressure-patience-pounce.mp4"}, {"cid": "C_74", "t": "1:09:47", "label": "Plays it back through the center", "tags": ["combine"], "href": "2026-11-01_vs-lcysa/players/lillian/04_C_74_plays-it-back-through-the-center.mp4"}, {"cid": "C_76", "t": "1:10:45", "label": "Not patient enough in pressure; runs in without slowing down", "tags": ["defend", "calm"], "href": "2026-11-01_vs-lcysa/players/lillian/05_C_76_not-patient-enough-in-pressure-runs-in-without-slowing-down.mp4"}]}]};
const BASE='https://www.dropbox.com/scl/fo/ihin7qn8o1oljnsx1b0q2/ACAj5muSS0h2_ZUz6kBUzIg?rlkey=dsakpc7ajzmrn2vyhlx0n93ub&st=96j8mdka&preview=';
const TN=Object.fromEntries(D.tags);
const order=["goal", "teach", "chance", "defend", "calm", "takeon", "combine"];
let sel=null;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(d){const [y,m,dd]=d.split('-').map(Number);const x=new Date(y,m-1,dd);return DOW[x.getDay()]+', '+MON[m-1]+' '+dd;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
const all=D.games.flatMap(g=>g.clips);
const goals=all.filter(c=>c.tags.includes('goal')).length;
document.getElementById('sub').innerHTML='<b>'+all.length+' clips</b> from '+D.games.length+' games'+(goals?', including '+goals+' goals':'');
function renderFilters(){
  const box=document.getElementById('filters');box.textContent='';
  const a=el('button','f'+(sel?'':' on'),'All');a.type='button';a.id='f-all';a.append(el('small',null,String(all.length)));
  a.onclick=()=>{sel=null;render();};box.append(a);
  order.filter(k=>TN[k]).forEach(k=>{
    const n=all.filter(c=>c.tags.includes(k)).length;if(!n)return;
    const b=el('button','f t-'+k+(sel===k?' on':''),TN[k]);b.type='button';b.dataset.t=k;b.id='f-'+k;
    b.append(el('small',null,String(n)));b.setAttribute('aria-pressed',sel===k);
    b.onclick=()=>{sel=sel===k?null:k;render();};box.append(b);
  });
}
function renderGames(){
  const root=document.getElementById('games');root.textContent='';
  let shown=0;
  D.games.forEach(g=>{
    const cl=g.clips.filter(c=>!sel||c.tags.includes(sel));if(!cl.length)return;shown+=cl.length;
    const sec=el('section','game');
    const h=el('h2',null,'vs '+g.opp);h.append(el('span',null,fmt(g.date)+' · '+cl.length+(cl.length===1?' clip':' clips')));
    sec.append(h);
    const ul=el('ul');
    cl.forEach(c=>{
      const li=el('li');const n=el('div','note');
      n.append(el('p','txt',c.label));
      const m=el('div','meta');
      if(c.t)m.append(el('span','clock','Game time '+c.t));
      order.filter(k=>c.tags.includes(k)).forEach(k=>m.append(el('span','tag t-'+k,TN[k])));
      n.append(m);
      const a=el('a','watch','Watch');a.href=BASE+encodeURIComponent(c.href)+'&dl=0';a.target='_blank';a.rel='noopener';
      a.setAttribute('aria-label','Watch clip: '+c.label);
      li.append(n,a);ul.append(li);
    });
    sec.append(ul);root.append(sec);
  });
  if(!shown)root.append(el('p','empty','No clips with this tag.'));
}
function render(){renderFilters();renderGames();}
render();
</script>
</body>
</html>
