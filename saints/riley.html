<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Riley — Saints U14G Fall 2026</title>
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f8f7; --surface:#ffffff; --fg:#14201b; --muted:#5d6b64; --line:#dbe3df; --accent:#0f6b4f; --accent-fg:#ffffff;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --goal-bg:#ffe1d6; --goal-fg:#a82b00; --teach-bg:#fff0d0; --teach-fg:#7d4600; --chance-bg:#dcf4e1; --chance-fg:#17692f;
  --defend-bg:#e0ebff; --defend-fg:#1f4fb5; --calm-bg:#d6f2ef; --calm-fg:#0b6560; --takeon-bg:#eee2fb; --takeon-fg:#6a2fb0;
  --combine-bg:#fde3ec; --combine-fg:#a3224d;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f1714; --surface:#16211d; --fg:#e6eee9; --muted:#9bada5; --line:#27362f; --accent:#4fd1a1; --accent-fg:#06231a;
  --goal-bg:#40190d; --goal-fg:#ff9a73; --teach-bg:#3a2c10; --teach-fg:#f5b04d; --chance-bg:#14301c; --chance-fg:#6fd48a;
  --defend-bg:#15264a; --defend-fg:#7fa8ff; --calm-bg:#0f302d; --calm-fg:#5fd3cb; --takeon-bg:#2a1b40; --takeon-fg:#c39bf5;
  --combine-bg:#40172a; --combine-fg:#f58bb0; color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));margin:0}
.wrap{max-width:760px;margin:0 auto}
.eyebrow{font:600 13px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
h1{font:700 clamp(48px,12vw,84px)/.95 var(--display);margin:0;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);margin:10px 0 0}
.sub b{color:var(--fg);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 8px}
.f{font:500 14px/1 var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:8px 12px;border-radius:999px;cursor:pointer}
.f small{opacity:.7;margin-left:5px}
.f:focus-visible,.watch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.f.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.f[data-t]{background:var(--tb);color:var(--tf);border-color:var(--tf)}
.f[data-t].on{background:var(--tf);color:var(--bg)}
.game{margin-top:28px}
.game h2{font:700 28px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.game h2 span{font:500 14px/1 var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
ul{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line)}
li{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.note{min-width:0}
.txt{margin:0;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.clock{font:500 12px/1 var(--body);color:var(--muted);font-variant-numeric:tabular-nums;margin-right:2px}
.tag{font:600 12px/1 var(--body);padding:4px 8px;border-radius:999px;background:var(--tb);color:var(--tf);white-space:nowrap}
.watch{font:600 15px/1 var(--body);text-decoration:none;background:var(--accent);color:var(--accent-fg);padding:11px 16px;border-radius:8px;white-space:nowrap;display:inline-block}
.watch:hover{filter:brightness(1.08)}
.empty{color:var(--muted);padding:20px 0}
.t-goal{--tb:var(--goal-bg);--tf:var(--goal-fg)}.t-teach{--tb:var(--teach-bg);--tf:var(--teach-fg)}.t-chance{--tb:var(--chance-bg);--tf:var(--chance-fg)}
.t-defend{--tb:var(--defend-bg);--tf:var(--defend-fg)}.t-calm{--tb:var(--calm-bg);--tf:var(--calm-fg)}.t-takeon{--tb:var(--takeon-bg);--tf:var(--takeon-fg)}.t-combine{--tb:var(--combine-bg);--tf:var(--combine-fg)}
.foot{margin-top:40px;color:var(--muted);font-size:14px}
@media (max-width:460px){li{grid-template-columns:1fr}.watch{justify-self:start}}
@media (prefers-reduced-motion:no-preference){.f,.watch{transition:background .15s,filter .15s}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Saints U14 Girls · Fall 2026</p>
  <h1>Riley</h1>
  <p class="sub" id="sub"></p>
  <div class="filters" id="filters" role="group" aria-label="Filter clips by tag"></div>
  <div id="games"></div>
  <p class="foot">Each clip opens in Dropbox in a new tab. The note under each clip is Coach Ben's.</p>
</div>

<script>
const D={"tags": [["goal", "Goal scored"], ["teach", "Teach"], ["chance", "Goals & chances"], ["defend", "Defend"], ["calm", "Calm on ball"], ["takeon", "Take on"], ["combine", "Pass & combine"]], "games": [{"date": "2026-09-13", "opp": "Oregon Surf", "clips": [{"cid": "C_38", "t": "50:07-50:30", "label": "Riley throw-in to Izzy (now striker), Izzy drives hard and lays off", "tags": ["takeon", "combine"], "href": "2026-09-13_vs-oregon-surf/players/riley/01_C_38_riley-throw-in-to-izzy-now-striker-izzy-drives-hard-and-lays.mp4"}, {"cid": "C_42", "t": "57:22-58:30", "label": "GOAL from Joelle — mirrors Izzy's earlier drive, same location, Riley throw-in origin", "tags": ["goal", "chance", "takeon"], "href": "2026-09-13_vs-oregon-surf/players/riley/02_C_42_goal-from-joelle-mirrors-izzy-s-earlier-drive-same-location.mp4"}, {"cid": "C_44", "t": "61:06-61:26", "label": "Fantastic step forward to cut off pass and get involved in attacking play", "tags": ["combine"], "href": "2026-09-13_vs-oregon-surf/players/riley/03_C_44_fantastic-step-forward-to-cut-off-pass-and-get-involved-in-a.mp4"}]}, {"date": "2026-09-19", "opp": "Columbia Premier", "clips": [{"cid": "C_14", "t": "9:05-9:25", "label": "Great tackle", "tags": ["defend"], "href": "2026-09-19_vs-columbia-premier/players/riley/01_C_14_great-tackle.mp4"}, {"cid": "C_39", "t": "43:26-43:46", "label": "Teaching reminder: keep feet down", "tags": ["teach"], "href": "2026-09-19_vs-columbia-premier/players/riley/02_C_39_teaching-reminder-keep-feet-down.mp4"}, {"cid": "C_59", "t": "4:53-5:13", "label": "Good defensive shape", "tags": ["defend"], "href": "2026-09-19_vs-columbia-premier/players/riley/03_C_59_good-defensive-shape.mp4"}, {"cid": "C_60", "t": "65:05-65:35", "label": "Good work together", "tags": ["combine"], "href": "2026-09-19_vs-columbia-premier/players/riley/04_C_60_good-work-together.mp4"}, {"cid": "C_61", "t": "74:25-74:45", "label": "Good starting position", "tags": [], "href": "2026-09-19_vs-columbia-premier/players/riley/05_C_61_good-starting-position.mp4"}, {"cid": "C_62", "t": "45:05-45:25", "label": "Good starting position together", "tags": [], "href": "2026-09-19_vs-columbia-premier/players/riley/06_C_62_good-starting-position-together.mp4"}, {"cid": "C_63", "t": "45:22-45:42", "label": "Good physicality, gets into the back of the player", "tags": ["defend"], "href": "2026-09-19_vs-columbia-premier/players/riley/07_C_63_good-physicality-gets-into-the-back-of-the-player.mp4"}]}, {"date": "2026-09-26", "opp": "Lincoln Fc", "clips": [{"cid": "C_12", "t": "22:38", "label": "Great clearance and combination", "tags": ["defend", "combine"], "href": "2026-09-26_vs-lincoln-fc/players/riley/01_C_12_great-clearance-and-combination.mp4"}, {"cid": "C_56", "t": "66:29", "label": "Nice layoff", "tags": ["combine"], "href": "2026-09-26_vs-lincoln-fc/players/riley/12_C_56_nice-layoff.mp4"}, {"cid": "C_73", "t": "79:34", "label": "Great defensive work (far away, hard to see clearly)", "tags": ["defend"], "href": "2026-09-26_vs-lincoln-fc/players/riley/02_C_73_great-defensive-work-far-away-hard-to-see-clearly.mp4"}, {"cid": "C_78", "t": "87:54", "label": "Interesting defensive instincts — in general want her going to get the ball more", "tags": ["defend"], "href": "2026-09-26_vs-lincoln-fc/players/riley/03_C_78_interesting-defensive-instincts-in-general-want-her-going-to.mp4"}, {"cid": "C_80", "t": "89:28", "label": "Nice interception", "tags": ["defend"], "href": "2026-09-26_vs-lincoln-fc/players/riley/04_C_80_nice-interception.mp4"}]}, {"date": "2026-10-03", "opp": "Pcu", "clips": [{"cid": "C_01", "t": "15:48", "label": "Good strong pass", "tags": ["defend", "combine"], "href": "2026-10-03_vs-pcu/players/riley/01_C_01_good-strong-pass.mp4"}, {"cid": "C_04", "t": "16:35", "label": "Good pressure to prevent the turn", "tags": ["defend", "takeon"], "href": "2026-10-03_vs-pcu/players/riley/02_C_04_good-pressure-to-prevent-the-turn.mp4"}, {"cid": "C_59", "t": "1:19:20", "label": "Nice pressure", "tags": ["defend"], "href": "2026-10-03_vs-pcu/players/riley/03_C_59_nice-pressure.mp4"}]}, {"date": "2026-10-04", "opp": "Fsc", "clips": [{"cid": "C_02", "t": "7:40", "label": "Morgan good drop to Riley, who clears the ball into space", "tags": ["defend", "combine"], "href": "2026-10-04_vs-fsc/players/riley/01_C_02_morgan-good-drop-to-riley-who-clears-the-ball-into-space.mp4"}]}, {"date": "2026-10-10", "opp": "Oregon Surf", "clips": [{"cid": "C_03", "t": "39:13", "label": "TEACH Too much pressure, none of the patience", "tags": ["teach", "defend", "calm"], "href": "2026-10-10_vs-oregon-surf/players/riley/01_C_03_teach-too-much-pressure-none-of-the-patience.mp4"}, {"cid": "C_12", "t": "47:26", "label": "TEACH Too much pounce, not enough patience", "tags": ["teach", "calm"], "href": "2026-10-10_vs-oregon-surf/players/riley/02_C_12_teach-too-much-pounce-not-enough-patience.mp4"}]}, {"date": "2026-10-17", "opp": "Lincoln Fc", "clips": [{"cid": "C_09", "t": "5:57", "label": "Riley nice calmness", "tags": ["calm"], "href": "2026-10-17_vs-lincoln-fc/players/riley/01_C_09_riley-nice-calmness.mp4"}, {"cid": "C_23", "t": "22:00", "label": "Iris good communication to Riley to reset backline shape", "tags": [], "href": "2026-10-17_vs-lincoln-fc/players/riley/02_C_23_iris-good-communication-to-riley-to-reset-backline-shape.mp4"}, {"cid": "C_40", "t": "52:16", "label": "Riley and Mo good combination", "tags": ["combine"], "href": "2026-10-17_vs-lincoln-fc/players/riley/03_C_40_riley-and-mo-good-combination.mp4"}, {"cid": "C_44", "t": "59:48", "label": "Riley puts foot in for a good tackle", "tags": ["defend"], "href": "2026-10-17_vs-lincoln-fc/players/riley/04_C_44_riley-puts-foot-in-for-a-good-tackle.mp4"}, {"cid": "C_46", "t": "1:01:18", "label": "Riley nice forward pass", "tags": ["combine"], "href": "2026-10-17_vs-lincoln-fc/players/riley/05_C_46_riley-nice-forward-pass.mp4"}, {"cid": "C_52", "t": "1:08:49", "label": "Riley good tackle", "tags": ["defend"], "href": "2026-10-17_vs-lincoln-fc/players/riley/06_C_52_riley-good-tackle.mp4"}]}, {"date": "2026-11-01", "opp": "Lcysa", "clips": [{"cid": "C_28", "t": "13:34", "label": "Good defensive positioning", "tags": ["defend"], "href": "2026-11-01_vs-lcysa/players/riley/01_C_28_good-defensive-positioning.mp4"}, {"cid": "C_35", "t": "18:40", "label": "Good aggressiveness", "tags": ["defend"], "href": "2026-11-01_vs-lcysa/players/riley/02_C_35_good-aggressiveness.mp4"}, {"cid": "C_47", "t": "27:59", "label": "Good support play", "tags": [], "href": "2026-11-01_vs-lcysa/players/riley/03_C_47_good-support-play.mp4"}, {"cid": "C_58", "t": "54:25", "label": "Starting position too wide, attacker inside her; needs to be goal side", "tags": ["teach", "chance"], "href": "2026-11-01_vs-lcysa/players/riley/04_C_58_starting-position-too-wide-attacker-inside-her-needs-to-be-g.mp4"}]}]};
const BASE='https://www.dropbox.com/scl/fo/ihin7qn8o1oljnsx1b0q2/ACAj5muSS0h2_ZUz6kBUzIg?rlkey=dsakpc7ajzmrn2vyhlx0n93ub&st=96j8mdka&preview=';
const TN=Object.fromEntries(D.tags);
const order=["goal", "teach", "chance", "defend", "calm", "takeon", "combine"];
let sel=null;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function fmt(d){const [y,m,dd]=d.split('-').map(Number);const x=new Date(y,m-1,dd);return DOW[x.getDay()]+', '+MON[m-1]+' '+dd;}
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
const all=D.games.flatMap(g=>g.clips);
const goals=all.filter(c=>c.tags.includes('goal')).length;
document.getElementById('sub').innerHTML='<b>'+all.length+' clips</b> from '+D.games.length+' games'+(goals?', including '+goals+' goals':'');
function renderFilters(){
  const box=document.getElementById('filters');box.textContent='';
  const a=el('button','f'+(sel?'':' on'),'All');a.type='button';a.id='f-all';a.append(el('small',null,String(all.length)));
  a.onclick=()=>{sel=null;render();};box.append(a);
  order.filter(k=>TN[k]).forEach(k=>{
    const n=all.filter(c=>c.tags.includes(k)).length;if(!n)return;
    const b=el('button','f t-'+k+(sel===k?' on':''),TN[k]);b.type='button';b.dataset.t=k;b.id='f-'+k;
    b.append(el('small',null,String(n)));b.setAttribute('aria-pressed',sel===k);
    b.onclick=()=>{sel=sel===k?null:k;render();};box.append(b);
  });
}
function renderGames(){
  const root=document.getElementById('games');root.textContent='';
  let shown=0;
  D.games.forEach(g=>{
    const cl=g.clips.filter(c=>!sel||c.tags.includes(sel));if(!cl.length)return;shown+=cl.length;
    const sec=el('section','game');
    const h=el('h2',null,'vs '+g.opp);h.append(el('span',null,fmt(g.date)+' · '+cl.length+(cl.length===1?' clip':' clips')));
    sec.append(h);
    const ul=el('ul');
    cl.forEach(c=>{
      const li=el('li');const n=el('div','note');
      n.append(el('p','txt',c.label));
      const m=el('div','meta');
      if(c.t)m.append(el('span','clock','Game time '+c.t));
      order.filter(k=>c.tags.includes(k)).forEach(k=>m.append(el('span','tag t-'+k,TN[k])));
      n.append(m);
      const a=el('a','watch','Watch');a.href=BASE+encodeURIComponent(c.href)+'&dl=0';a.target='_blank';a.rel='noopener';
      a.setAttribute('aria-label','Watch clip: '+c.label);
      li.append(n,a);ul.append(li);
    });
    sec.append(ul);root.append(sec);
  });
  if(!shown)root.append(el('p','empty','No clips with this tag.'));
}
function render(){renderFilters();renderGames();}
render();
</script>
</body>
